[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiolibrenms"
version = "0.0.4"
description = "Asynchronous library to fetch data from a libreNMS instance."
authors = [{ name = "mib1185" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = '>=3.11'
dependencies = ["aiohttp", "mashumaro"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "aiointercept==0.1.11",
    "black==26.5.1",
    "mypy==2.3.1",
    "pre-commit-hooks==6.0.0",
    "prek==0.5.9",
    "pylint==4.0.9",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest==9.1.1",
    "reorder-python-imports==3.17.0",
    "syrupy==6.1.1",
]

[project.urls]
homepage = 'https://github.com/mib1185/aiolibrenms'
repository = 'https://github.com/mib1185/aiolibrenms'

[tool.setuptools]
package-data = { "aiolibrenms" = ["py.typed"] }
platforms = ["any"]

[tool.setuptools.packages.find]
include = ["aiolibrenms*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
